name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dbt.txt
      - run: pip install -r requirements.txt -r requirements-dbt.txt
      - run: pytest -q
      # dbt models run against the small SYNTHETIC sample committed in dbt/sample_data (not real data).
      - name: dbt build on synthetic sample
        run: dbt build --project-dir dbt --profiles-dir dbt --vars '{data_root: dbt/sample_data}'
