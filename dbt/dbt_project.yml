name: valenbisi
version: "0.1.0"
config-version: 2
profile: valenbisi

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

vars:
  # Where the Hive-partitioned parquet lives, relative to this dbt/ directory (run dbt from the repo root
  # with --project-dir dbt, or from dbt/ itself; paths below resolve against the current directory).
  # Real data: data_repo     CI / demo (SYNTHETIC): dbt/sample_data
  data_root: data_repo
  # Data-quality rule (decided 2026-10-25, see docs/analysis_charter.md): a station-snapshot is "stuck" when its bike
  # count has not changed for this many hours. `last_reported` is NOT used: it barely moves when counts do.
  stuck_flag_hours: 6        # flagged (is_stuck); used for the strict sensitivity version of the rates
  stuck_exclude_hours: 12    # excluded from headline stockout/blockout rates (is_stuck_excluded)
  # Activity (abs change in bike count) is only counted between snapshots at most this far apart.
  max_delta_gap_minutes: 30
  # Segmentation / KPI results are marked provisional until this many distinct days exist.
  min_days_final: 14
  # A day only counts toward segmentation when it has at least this many snapshots (~10 min cadence => ~144/day max).
  min_snapshots_per_day: 24
  # ABC: cumulative share of activity. A = top 80 %, B = next 15 %, C = rest.
  abc_a_cutoff: 0.80
  abc_b_cutoff: 0.95
  # XYZ: coefficient of variation (sd/mean) of daily activity.
  xyz_x_max_cv: 0.5
  xyz_y_max_cv: 1.0
  # Run-health checks
  max_run_gap_hours: 3
  check_recency: false

seeds:
  valenbisi:
    holidays:
      +column_types: {holiday_date: date}

models:
  valenbisi:
    staging:
      +materialized: view
    marts:
      +materialized: table
