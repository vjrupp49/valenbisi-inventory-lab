# Two simulators share this file.
#  * src/simulate/run.py (synthetic): every number below is an ASSUMPTION, not an estimate from the Valenbisi data.
#  * src/simulate/run_empirical.py (Phase 7): the [demand] and [system] size/capacity blocks are IGNORED. Demand rates,
#    stations, capacities and day-to-day variation come from the frozen dataset; forecast noise is matched to the measured
#    forecast accuracy. What stays an assumption there: [rebalancing] (the budget and timing) and [empirical] scales.
#    Results from either simulator compare policies under stated assumptions; they are not estimates of real savings.

[system]
n_stations = 60
capacity_min = 15            # docks per station, drawn uniformly in [min, max]
capacity_max = 30
initial_fill = 0.5           # fraction of capacity holding a bike at the start
n_days = 5                   # simulated days per replication (state carries across days)

[demand]
# Mean trips (pickups) per station per day, scaled by a per-station popularity factor.
mean_pickups_per_station_day = 40.0
popularity_sigma = 0.5       # lognormal sigma of per-station popularity
morning_peak_hour = 8.5      # commute pulses; pulse(h) = +1 near morning peak, -1 near evening peak
evening_peak_hour = 18.5
peak_width_h = 1.5
direction_sd = 0.5           # per-station commute direction ~ N(0, sd), clipped to [-0.9, 0.9]
imbalance_strength = 0.8     # how strongly the direction skews pickups vs returns during pulses
day_noise_sigma = 0.25       # lognormal day-to-day multiplicative noise per station (unforecastable part)

[rebalancing]
round_hours = [6, 10, 14, 18]   # hours of day at which a rebalancing round happens
n_trucks = 2
truck_capacity = 12             # bikes per single transfer (one pickup stop + one drop stop)
transfers_per_truck_per_round = 3
cost_per_transfer = 1.0         # abstract cost unit; only used to compare policies at equal budget
target_fill = 0.5               # post-rebalancing target fraction of capacity
lookahead_h = 4                 # hours ahead the forecast-driven policy plans for
static_route_stations = 20      # static policy only ever visits this fixed set (chosen at random once)

[forecast]
# The forecast-driven policy sees the TRUE expected net outflow over the lookahead window,
# degraded by noise: f_hat = f * (1 + N(0, rel_noise)) + N(0, abs_noise). rel_noise large = bad forecaster.
# This is a knob representing forecast skill, not a fitted model.
rel_noise = 0.3
abs_noise = 1.0

[monte_carlo]
n_replications = 200
seed = 42

[empirical]
# Settings for src/simulate/run_empirical.py only.
estimate_dir = "src/simulate/estimated"      # demand_rates.csv, stations.csv, summary.json written from the data
baseline_demand_scale = 1.0                  # counted pickups are a lower bound on true trips; the grid below tests higher values
demand_scales = [1.0, 1.5, 2.0]
transfers_per_round = [3, 6, 12]             # rebalancing budget: transfers per round (baseline = n_trucks * transfers_per_truck_per_round = 6)
n_replications = 100                         # baseline scenario
grid_replications = 40                       # each cell of the sensitivity grid
calibration_replications = 30
seed = 11
